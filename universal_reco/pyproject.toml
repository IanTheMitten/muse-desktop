[project]
name = "universal-reco"
version = "0.1.0"
description = "Universal, lightweight, audio-only music embedding model"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "numpy",
    "torchcodec>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["content_embed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
