# Builds the desktop app on the two release targets and smoke-tests it in the real webview. Manual or tag-triggered only: macOS minutes count 10x on a private repo. The worker job freezes torch; Intel Macs get no worker (no torch wheel). Two release flows: a v* tag builds only the app legs and publishes the installers with docs/release-notes/<tag>.md; a worker-v* tag builds only the worker legs and publishes a non-latest release with both zips.
name: package

on:
  workflow_dispatch:
  push:
    tags: ["v*", "worker-v*", "ci-package-*"]

jobs:
  package:
    if: ${{ !startsWith(github.ref, 'refs/tags/worker-v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv run --group package python scripts/freeze_sidecar.py
      - run: web/node_modules/.bin/tauri build
      # Apple Silicon refuses a downloaded app whose bundle signature is broken ("Muse is damaged"); the smoke run below launches the raw binary without quarantine, so it cannot catch that.
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Muse.app
      # macOS 26 can reject an unsigned downloaded .dmg itself as damaged, so the app also ships as a zip; ditto keeps the bundle's signature intact.
      - if: runner.os == 'macOS'
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          arch=$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64)
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Muse.app "Muse_${version}_${arch}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # On macOS the smoke runs the signed binaries inside Muse.app, so a signing setting that stops the sidecar from starting fails here.
      - run: uv run python scripts/shell_smoke.py --binary ${{ runner.os == 'macOS' && 'src-tauri/target/release/bundle/macos/Muse.app/Contents/MacOS/muse-shell' || 'src-tauri/target/release/muse-shell' }} --expect mp3,flac,m4a,wav --report-out smoke-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-report.json

  worker:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run --extra embed --group package python scripts/freeze_worker.py
      - run: uv run --extra embed python scripts/fetch_weights.py --keys mert,minilm,schufo,mms --out build/ci-weights
      - run: uv run python scripts/worker_smoke.py --worker build/worker-dist/muse-worker/muse-worker${{ runner.os == 'Windows' && '.exe' || '' }} --weights build/ci-weights/weights --ops hello,mert,minilm,align --fixture tests/fixtures/smoke/tone.wav
      - uses: actions/upload-artifact@v7
        with:
          name: worker-${{ matrix.os }}
          path: build/muse-worker-*.zip
          if-no-files-found: error

  release-worker:
    needs: worker
    if: ${{ startsWith(github.ref, 'refs/tags/worker-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: worker-*
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --latest=false --title "Smart features worker $GITHUB_REF_NAME" --notes "Worker builds for Muse smart features."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  release-app:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      # The website links to releases/latest/download/<name>, so each installer also ships under a version-free name that stays the same across releases.
      - run: |
          mkdir dist/stable
          copy() {
            set -- $1 "$2"
            if [ "$#" -ne 2 ] || [ ! -f "$1" ]; then echo "expected exactly one match for the $2 installer" >&2; exit 1; fi
            cp "$1" "dist/stable/$2"
          }
          copy 'dist/dmg/*_aarch64.dmg' Muse_aarch64.dmg
          copy 'dist/dmg/*_x64.dmg' Muse_x64.dmg
          copy 'dist/macos/*_aarch64.zip' Muse_aarch64.zip
          copy 'dist/macos/*_x64.zip' Muse_x64.zip
          copy 'dist/nsis/*_x64-setup.exe' Muse_x64-setup.exe
      - run: gh release create "$GITHUB_REF_NAME" dist/dmg/*.dmg dist/macos/*.zip dist/nsis/*.exe dist/stable/* --title "Muse ${GITHUB_REF_NAME#v}" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
