[project]
name = "muse"
version = "0.1.0"
description = "Muse Player — self-hosted music player for a single listener on a tailnet"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "mutagen",
    "watchfiles",
    "implicit",
    "numpy",
    "send2trash>=2.1.0",
]

# Worker only: the frozen ML worker (and dev/slow tests) import these; the
# sidecar never does. Everything else, including the default test run, runs
# against the stub encoders and never imports this group.
[project.optional-dependencies]
embed = [
    "torch==2.15.0",
    "transformers==5.22.0",
    "sentence-transformers==6.2.0",
    "numpy",
    "av==19.0.2",
    "laya==0.3.20",
]
# Only muse/ingest.py's real providers need these — yt-dlp for audio, mutagen
# for m4a tagging, lyricsgenius for the Genius lyrics fallback. Everything
# else, including the default test run, runs against fakes and never
# imports this group. lyricsgenius stays importable-but-inert without
# GENIUS_TOKEN set, same as music_downloader.py today.
ingest = [
    "yt-dlp",
    "mutagen",
    "lyricsgenius",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]
package = ["pyinstaller==6.22.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
asyncio_mode = "auto"
markers = [
    "slow: needs the real CLAP/MiniLM encoders (the `embed` extra), the real ALS trainer (the `taste` extra), or the real MERT worker (all in the `embed` extra); run explicitly with -m slow",
]
