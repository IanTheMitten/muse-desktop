[package]
name = "muse-shell"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.0"
getrandom = "0.3"
serde_json = "1"

# Windows only: WebView2 crash and navigation-failure events (src/webview_watch.rs). Same versions Tauri 2.12 already uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
